[package]
name = "grok-super-usage"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Omarchy SuperGrok weekly usage bar widget — Rust scanner"
authors = ["Derrick Egersdorfer"]
publish = false

[[bin]]
name = "grok-super-usage"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
